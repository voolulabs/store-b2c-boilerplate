# Seed idempotente (Brasil como primeira região, metadata.pos.payment_methods
# com ids reais, providers de terminal na região) — ato EXPLÍCITO por decisão:
#   docker-compose --profile seed run --rm seed
# O standalone embarca os scripts já compilados (src/scripts/seed.js), sem
# loader TS. Depende de postgres healthy e recebe as mesmas env do backend.
services:
  seed:
    image: pos-backend:homolog
    profiles: ["seed"]
    command: ["node", "node_modules/@medusajs/cli/cli.js", "exec", "./src/scripts/seed.js"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/medusa?sslmode=disable
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      MEDUSA_DISABLE_TELEMETRY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
